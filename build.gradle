plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.21"
}

group = "local.automace"
version = "1.0.0-buildtest"

repositories {
    maven { url = uri("https://maven.fabricmc.net/") }
    mavenCentral()
}

def mcVersion = project.property("minecraft_version")
def loaderVersion = project.property("loader_version")
def fabricApiVersion = project.property("fabric_api_version")

dependencies {
    minecraft "com.mojang:minecraft:" + mcVersion
    mappings "net.fabricmc:intermediary:" + mcVersion + ":v2"
    modImplementation "net.fabricmc:fabric-loader:" + loaderVersion
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + fabricApiVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named("jar") {
    archiveBaseName = "automace"
}

tasks.named("remapJar") {
    archiveBaseName = "automace"
}
